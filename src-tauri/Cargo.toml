[package]
name = "plain"
version = "0.1.0"
description = "A lightweight code editor built with Tauri"
edition = "2021"

[lib]
name = "plain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cap-fs-ext = "=4.0.2"
cap-std = "4.0.2"
globset = "=0.4.19"
grep-matcher = "=0.1.9"
grep-regex = "=0.1.14"
grep-searcher = "=0.1.17"
ignore = "=0.4.31"
jsonc-parser = { version = "=0.33.0", default-features = false, features = [] }
libghostty-vt = "=0.2.1"
notify = "=8.2.0"
portable-pty = "=0.9.0"
russh = "=0.62.5"
russh-sftp = "=2.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = { version = "=0.10.9", default-features = false, features = [] }
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-dialog = "2.7.1"
tokio = { version = "=1.53.0", default-features = false, features = ["net", "time", "macros", "rt", "io-util"] }
uuid = { version = "1.24.0", features = ["v4"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.186"

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "=0.6.4", default-features = false, features = ["std"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSError", "NSFileManager", "NSURL"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "=1.53.0", default-features = false, features = ["fs", "process"] }
tokio-stream = { version = "0.1.19", default-features = false, features = ["net"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
